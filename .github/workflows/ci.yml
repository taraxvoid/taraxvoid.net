# Written by voidflow v1.0.0-next.3: https://www.npmjs.com/package/@taraxvoid/voidflow
# Set up a repo the same way: npx @taraxvoid/voidflow init --kind site
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Add `merge_group:` here if you use a merge queue.
  schedule:
    - cron: '14 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@8f02fb9616caadd3aa11d575b5c6038cef09de8d # v1.0.0-next.3

  sarif:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'skipped' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: taraxvoid/voidflow/.github/workflows/upload-sarif.yml@8f02fb9616caadd3aa11d575b5c6038cef09de8d # v1.0.0-next.3

  # Pushes to main deploy to prod. There are no PR previews yet (no preview
  # env in wrangler.jsonc), so this job only runs on push.
  deploy:
    name: Deploy [prod]
    needs: validate
    if: github.event_name == 'push'
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails on anything but main or a pull request.
      - id: env
        uses: taraxvoid/voidflow/actions/branch-env-map@8f02fb9616caadd3aa11d575b5c6038cef09de8d # v1.0.0-next.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        uses: taraxvoid/voidflow/actions/bun-install@8f02fb9616caadd3aa11d575b5c6038cef09de8d # v1.0.0-next.3

      - name: Build
        run: bun run build

      - name: Deploy
        uses: taraxvoid/voidflow/actions/cloudflare-deploy@8f02fb9616caadd3aa11d575b5c6038cef09de8d # v1.0.0-next.3
        with:
          env: ${{ steps.env.outputs.env }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
